<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="London Seed Radar: weekly briefing banner">
  <title>London Seed Radar</title>
  <!--
    Concept 06, the requested hybrid: candidate 04's boldness (acid
    green field, black diagonal slab, Arial Black wordmark) carrying
    candidate 05's London map inside the slab, redrawn in acid green,
    with the radar motif centred on the Thames bend so the scope sits
    on the city itself. Palette: acid green #CCFF00, near-black
    #0A0A0A, white for the fresh blip halo.
  -->

  <defs>
    <!-- The city as a quiet field of green points; dots that fall
         outside the slab land green on green and disappear. -->
    <pattern id="cityGrid6" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.4" fill="#CCFF00"/>
    </pattern>
  </defs>

  <!-- Colour field -->
  <rect x="0" y="0" width="1100" height="220" fill="#CCFF00"/>

  <!-- Black slab, cut on a slight diagonal for poster energy -->
  <polygon points="760,0 1100,0 1100,220 816,220" fill="#0A0A0A"/>

  <!-- Dot grid city inside the slab -->
  <rect x="790" y="14" width="300" height="192" fill="url(#cityGrid6)" opacity="0.3"/>

  <!-- The Thames: candidate 05's single stroke with the Isle of Dogs
       U bend, scaled into the slab and recoloured -->
  <g transform="translate(297,42) scale(0.72)" fill="none" stroke="#CCFF00" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 686 102 C 722 98 746 122 780 124 C 814 126 830 98 864 97 C 894 96 902 121 910 149 C 916 171 930 183 948 183 C 966 183 980 170 986 148 C 994 122 1004 100 1034 95 C 1054 92 1066 95 1074 90" stroke-width="16" opacity="0.18"/>
    <path d="M 686 102 C 722 98 746 122 780 124 C 814 126 830 98 864 97 C 894 96 902 121 910 149 C 916 171 930 183 948 183 C 966 183 980 170 986 148 C 994 122 1004 100 1034 95 C 1054 92 1066 95 1074 90" stroke-width="6.5" opacity="0.95"/>
  </g>

  <!-- Radar scope centred on the river bend: the ping over Docklands,
       upgraded to a full sweep -->
  <g>
    <circle cx="980" cy="130" r="56" fill="none" stroke="#CCFF00" stroke-width="1.8" stroke-opacity="0.4"/>
    <circle cx="980" cy="130" r="36" fill="none" stroke="#CCFF00" stroke-width="1.8" stroke-opacity="0.6"/>
    <circle cx="980" cy="130" r="18" fill="none" stroke="#CCFF00" stroke-width="1.8" stroke-opacity="0.85"/>
    <path d="M 980 130 L 980 74 A 56 56 0 0 1 1022.9 94.1 Z" fill="#CCFF00" fill-opacity="0.16"/>
    <line x1="980" y1="130" x2="1022.9" y2="94.1" stroke="#CCFF00" stroke-width="2.5"/>
    <circle cx="980" cy="130" r="3" fill="#CCFF00"/>
  </g>

  <!-- This week's rounds across the city; the fresh one is haloed white -->
  <g fill="#CCFF00">
    <circle cx="813" cy="88" r="3"/>
    <circle cx="826" cy="103" r="2.2"/>
    <circle cx="850" cy="147" r="2.6"/>
    <circle cx="877" cy="169" r="2.2"/>
    <circle cx="903" cy="84" r="3.2"/>
    <circle cx="1040" cy="88" r="3"/>
  </g>
  <circle cx="1020" cy="156" r="4" fill="#FFFFFF"/>
  <circle cx="1020" cy="156" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Cartographic whisper, bottom of the slab -->
  <text x="1086" y="204" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#CCFF00" fill-opacity="0.75">51.5072 N &#183; 0.1276 W</text>

  <!-- Kicker pill -->
  <rect x="48" y="24" width="178" height="27" fill="#0A0A0A"/>
  <text x="137" y="42.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="13" letter-spacing="2" fill="#CCFF00">WEEKLY BRIEFING</text>

  <!-- Wordmark: textLength pins the measure so system fonts always fill the block -->
  <text x="48" y="130" font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif" font-weight="900" font-size="62" fill="#0A0A0A" textLength="660" lengthAdjust="spacingAndGlyphs">LONDON SEED RADAR</text>

  <!-- Issue line: swap the text content below for each issue -->
  <polygon points="48,159 48,175 61,167" fill="#0A0A0A"/>
  <text id="issue-line" x="70" y="174" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="21" fill="#0A0A0A">7 new rounds &#183; week of 10 June 2026</text>

  <!-- Base rule grounds the banner against the white email below -->
  <rect x="0" y="214" width="1100" height="6" fill="#0A0A0A"/>
</svg>
