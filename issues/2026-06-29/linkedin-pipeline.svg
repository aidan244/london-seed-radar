<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="London Seed Radar data pipeline: sources, ingest, sieve, enrich, publish, outputs">
  <title>London Seed Radar data pipeline</title>
  <!--
    LinkedIn explainer, redrawn as a technical flow diagram.
    Brand palette: near-black #0A0A0A field, acid green #CCFF00, white,
    muted grey for the drop branch. Moving parts: four input sources fan
    into INGEST, a shared radar.db store, SIEVE with four gates and a
    DROPPED branch, then ENRICH and PUBLISH fanning out to three outputs.
  -->

  <defs>
    <marker id="ar" viewBox="0 0 8 8" markerWidth="7.5" markerHeight="7.5" refX="6.5" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#CCFF00"/>
    </marker>
    <marker id="arGrey" viewBox="0 0 8 8" markerWidth="7.5" markerHeight="7.5" refX="6.5" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7d7d72"/>
    </marker>
  </defs>

  <!-- Field -->
  <rect x="0" y="0" width="1200" height="700" fill="#0A0A0A"/>

  <!-- Faint radar rings, brand texture -->
  <g fill="none" stroke="#CCFF00" stroke-opacity="0.09">
    <circle cx="1120" cy="78" r="44" stroke-width="1.5"/>
    <circle cx="1120" cy="78" r="76" stroke-width="1.5"/>
    <circle cx="1120" cy="78" r="108" stroke-width="1.5"/>
  </g>

  <!-- Top accent rule -->
  <rect x="0" y="0" width="1200" height="6" fill="#CCFF00"/>

  <!-- Kicker pill -->
  <rect x="60" y="42" width="252" height="28" fill="none" stroke="#CCFF00" stroke-width="1.5"/>
  <text x="186" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="13" letter-spacing="2" fill="#CCFF00">LONDON SEED RADAR</text>

  <!-- Title -->
  <text x="58" y="124" font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">THE <tspan fill="#CCFF00">RADAR</tspan> PIPELINE</text>
  <text x="60" y="155" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" fill-opacity="0.70">A public data pipeline: from raw funding signals to five verified startups, every fortnight.</text>

  <!-- ============ SOURCES ============ -->
  <text x="50" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#CCFF00" fill-opacity="0.85">SOURCES</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF">
    <rect x="50" y="200" width="175" height="44" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="63" y="227">Funding press (RSS)</text>
    <rect x="50" y="252" width="175" height="44" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="63" y="279">Companies House</text>
    <rect x="50" y="304" width="175" height="44" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="63" y="331">Accelerator watchlist</text>
    <rect x="50" y="356" width="175" height="44" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="63" y="383">Scout (Claude) + manual</text>
  </g>

  <!-- Fan-in arrows to INGEST -->
  <g stroke="#CCFF00" stroke-opacity="0.7" stroke-width="1.6" fill="none">
    <line x1="227" y1="222" x2="251" y2="338" marker-end="url(#ar)"/>
    <line x1="227" y1="274" x2="251" y2="342" marker-end="url(#ar)"/>
    <line x1="227" y1="326" x2="251" y2="348" marker-end="url(#ar)"/>
    <line x1="227" y1="378" x2="251" y2="352" marker-end="url(#ar)"/>
  </g>

  <!-- ============ PIPELINE SPINE ============ -->
  <!-- INGEST -->
  <rect x="255" y="308" width="130" height="74" rx="6" fill="#0F0F0F" stroke="#CCFF00" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="320" y="338" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="19" fill="#CCFF00">INGEST</text>
  <text x="320" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6">dedup by</text>
  <text x="320" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6">co. number + domain</text>

  <!-- SIEVE -->
  <rect x="415" y="250" width="175" height="190" rx="6" fill="#0F0F0F" stroke="#CCFF00" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="502" y="280" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="20" fill="#CCFF00">SIEVE</text>
  <text x="502" y="299" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.55">every candidate, all four:</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13.5">
    <text x="432" y="330"><tspan fill="#CCFF00" font-weight="bold">&#10003; </tspan><tspan fill="#FFFFFF">Geography</tspan><tspan fill="#8c917c" font-size="11"> &#183; in the UK</tspan></text>
    <text x="432" y="360"><tspan fill="#CCFF00" font-weight="bold">&#10003; </tspan><tspan fill="#FFFFFF">Stage</tspan><tspan fill="#8c917c" font-size="11"> &#183; pre-seed to A</tspan></text>
    <text x="432" y="390"><tspan fill="#CCFF00" font-weight="bold">&#10003; </tspan><tspan fill="#FFFFFF">Recency</tspan><tspan fill="#8c917c" font-size="11"> &#183; in window</tspan></text>
    <text x="432" y="420"><tspan fill="#CCFF00" font-weight="bold">&#10003; </tspan><tspan fill="#FFFFFF">Reality</tspan><tspan fill="#8c917c" font-size="11"> &#183; filing or press</tspan></text>
  </g>

  <!-- ENRICH -->
  <rect x="620" y="308" width="130" height="74" rx="6" fill="#0F0F0F" stroke="#CCFF00" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="685" y="338" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="18" fill="#CCFF00">ENRICH</text>
  <text x="685" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6">founders, headcount,</text>
  <text x="685" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6">live ATS roles</text>

  <!-- PUBLISH -->
  <rect x="780" y="308" width="130" height="74" rx="6" fill="#0F0F0F" stroke="#CCFF00" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="845" y="338" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="17" fill="#CCFF00">PUBLISH</text>
  <text x="845" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6">compose, render,</text>
  <text x="845" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6">export</text>

  <!-- Spine arrows -->
  <g stroke="#CCFF00" stroke-width="2" fill="none">
    <line x1="387" y1="345" x2="411" y2="345" marker-end="url(#ar)"/>
    <line x1="592" y1="345" x2="616" y2="345" marker-end="url(#ar)"/>
    <line x1="752" y1="345" x2="776" y2="345" marker-end="url(#ar)"/>
  </g>

  <!-- ============ DB STORE (under INGEST) ============ -->
  <g>
    <ellipse cx="320" cy="526" rx="70" ry="13" fill="#141414" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="1.4"/>
    <rect x="250" y="470" width="140" height="56" fill="#141414"/>
    <line x1="250" y1="470" x2="250" y2="526" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="1.4"/>
    <line x1="390" y1="470" x2="390" y2="526" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="1.4"/>
    <ellipse cx="320" cy="470" rx="70" ry="13" fill="#181818" stroke="#CCFF00" stroke-opacity="0.4" stroke-width="1.4"/>
    <text x="320" y="497" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#CCFF00">radar.db</text>
    <text x="320" y="513" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#FFFFFF" fill-opacity="0.55">SQLite working store</text>
  </g>
  <!-- read/write connector -->
  <line x1="320" y1="384" x2="320" y2="455" stroke="#CCFF00" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="332" y="425" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#CCFF00" fill-opacity="0.65">read / write</text>

  <!-- ============ DROPPED branch (under SIEVE) ============ -->
  <rect x="420" y="500" width="170" height="56" rx="6" fill="#161616" stroke="#7d7d72" stroke-width="1.5"/>
  <text x="505" y="527" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="16" fill="#b4b4a6">DROPPED</text>
  <text x="505" y="544" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8c8c80">with the reason logged</text>
  <line x1="502" y1="441" x2="502" y2="497" stroke="#7d7d72" stroke-width="1.6" marker-end="url(#arGrey)"/>
  <text x="514" y="475" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a8c">fails a gate</text>

  <!-- ============ OUTPUTS ============ -->
  <text x="945" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#CCFF00" fill-opacity="0.85">OUTPUTS</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">
    <rect x="945" y="250" width="205" height="56" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="958" y="282">Biweekly issue &#8594; Substack</text>
    <rect x="945" y="322" width="205" height="56" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="958" y="354">Public dataset, JSON + CSV</text>
    <rect x="945" y="394" width="205" height="56" rx="5" fill="#121212" stroke="#CCFF00" stroke-opacity="0.28" stroke-width="1.2"/>
    <text x="958" y="426">Jobs board, grad-flagged</text>
  </g>
  <!-- Fan-out arrows from PUBLISH -->
  <g stroke="#CCFF00" stroke-opacity="0.7" stroke-width="1.6" fill="none">
    <line x1="912" y1="340" x2="941" y2="278" marker-end="url(#ar)"/>
    <line x1="912" y1="345" x2="941" y2="350" marker-end="url(#ar)"/>
    <line x1="912" y1="350" x2="941" y2="422" marker-end="url(#ar)"/>
  </g>
  <text x="1047" y="476" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#CCFF00" fill-opacity="0.75">5 verified startups / issue</text>

  <!-- ============ ENGINE LAYER (Clay + Claude) ============ -->
  <!-- Clay powers the enrichment stage -->
  <line x1="685" y1="384" x2="685" y2="468" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#ar)"/>
  <rect x="600" y="470" width="172" height="52" rx="6" fill="#14160c" stroke="#CCFF00" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="686" y="495" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="15" fill="#CCFF00">CLAY</text>
  <text x="686" y="512" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#FFFFFF" fill-opacity="0.62">LinkedIn headcount + HQ check</text>

  <!-- Claude drafts the issue copy -->
  <line x1="845" y1="384" x2="845" y2="468" stroke="#CCFF00" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#ar)"/>
  <rect x="758" y="470" width="174" height="52" rx="6" fill="#14160c" stroke="#CCFF00" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="845" y="495" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="15" fill="#CCFF00">CLAUDE</text>
  <text x="845" y="512" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#FFFFFF" fill-opacity="0.62">drafts the issue copy</text>

  <!-- ============ Legend ============ -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#FFFFFF" fill-opacity="0.75">
    <line x1="60" y1="615" x2="92" y2="615" stroke="#CCFF00" stroke-width="2" marker-end="url(#ar)"/>
    <text x="100" y="619">data flow</text>
    <line x1="200" y1="615" x2="232" y2="615" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="240" y="619">database read / write</text>
    <line x1="400" y1="615" x2="432" y2="615" stroke="#7d7d72" stroke-width="1.6" marker-end="url(#arGrey)"/>
    <text x="440" y="619">dropped, with reason</text>
    <rect x="640" y="607" width="22" height="15" rx="3" fill="#14160c" stroke="#CCFF00" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="670" y="619">AI tool layer (Claude, Clay)</text>
  </g>

  <!-- Footer -->
  <text x="60" y="668" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.55">Built with Claude + Clay, from public sources only &#183; reviewed and published by a human &#183; aidan244.github.io/london-seed-radar</text>

  <!-- Base rule -->
  <rect x="0" y="694" width="1200" height="6" fill="#CCFF00"/>
</svg>
