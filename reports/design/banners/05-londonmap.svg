<?xml version="1.0" encoding="UTF-8"?>
<!--
  London Seed Radar masthead, concept 05: London as data.
  An abstract Thames stroke (one path, the recognisable U bend),
  a quiet dot grid for the city, coral dots for the week's rounds,
  one radar ping over the Docklands bend. Two colours plus greys:
  map blue #4F7DA8, signal coral #D9543E.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">London Seed Radar</title>
  <desc id="bannerDesc">Wordmark beside an abstract Thames curve and a scatter of small dots suggesting newly funded companies across London.</desc>

  <defs>
    <!-- The city as a quiet field of points -->
    <pattern id="cityGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.4" fill="#94A0AC"/>
    </pattern>
    <!-- Fade the grid out toward the wordmark -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="640" y="16" width="436" height="188" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- Background: near-white, sits quietly in a white email -->
  <rect x="0" y="0" width="1100" height="220" fill="#FDFDFC"/>

  <!-- Dot grid: the city, right of the type -->
  <rect x="640" y="16" width="436" height="188" fill="url(#cityGrid)" opacity="0.55" mask="url(#gridMask)"/>

  <!-- The Thames: one stroke west to east, with the big U around the Isle of Dogs -->
  <g fill="none" stroke="#4F7DA8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 686 102 C 722 98 746 122 780 124 C 814 126 830 98 864 97 C 894 96 902 121 910 149 C 916 171 930 183 948 183 C 966 183 980 170 986 148 C 994 122 1004 100 1034 95 C 1054 92 1066 95 1074 90" stroke-width="14" opacity="0.15"/>
    <path d="M 686 102 C 722 98 746 122 780 124 C 814 126 830 98 864 97 C 894 96 902 121 910 149 C 916 171 930 183 948 183 C 966 183 980 170 986 148 C 994 122 1004 100 1034 95 C 1054 92 1066 95 1074 90" stroke-width="5.5" opacity="0.9"/>
  </g>

  <!-- This week's rounds: small fixes of colour across the city -->
  <g fill="#D9543E">
    <circle cx="716" cy="64" r="3"/>
    <circle cx="734" cy="84" r="2.2"/>
    <circle cx="768" cy="146" r="2.6"/>
    <circle cx="806" cy="176" r="2.2"/>
    <circle cx="842" cy="58" r="3.2"/>
    <circle cx="1004" cy="158" r="2.6"/>
    <circle cx="1032" cy="64" r="3"/>
    <circle cx="1058" cy="120" r="2.2"/>
  </g>

  <!-- One radar ping, inside the river bend -->
  <g>
    <circle cx="948" cy="122" r="4" fill="#D9543E"/>
    <circle cx="948" cy="122" r="11" fill="none" stroke="#D9543E" stroke-width="1.6" opacity="0.45"/>
    <circle cx="948" cy="122" r="19" fill="none" stroke="#D9543E" stroke-width="1.2" opacity="0.2"/>
  </g>

  <!-- Masthead tick -->
  <rect x="64" y="50" width="36" height="5" fill="#D9543E"/>

  <!-- Wordmark -->
  <text x="64" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="5" fill="#16181B">LONDON SEED RADAR</text>

  <!-- Issue line: swap the text below each week -->
  <text x="66" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="1.2" fill="#5A6068">7 new rounds · week of 10 June 2026</text>

  <!-- Cartographic whisper: the city's coordinates -->
  <text x="66" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="2" fill="#9AA0A6">51.5072 N · 0.1276 W</text>

  <!-- Baseline hairline -->
  <line x1="0" y1="219" x2="1100" y2="219" stroke="#E6E6E4" stroke-width="1"/>
</svg>
