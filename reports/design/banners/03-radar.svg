<?xml version="1.0" encoding="UTF-8"?>
<!-- London Seed Radar: masthead banner, technical instrument / radar scope. -->
<!-- Palette: one accent green (#1E7C5C) plus black and greys on white. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="t">
  <title id="t">London Seed Radar: weekly briefing banner</title>
  <defs>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="68.67" y1="39.55" x2="167.33" y2="39.55">
      <stop offset="0" stop-color="#1E7C5C" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E7C5C" stop-opacity="0.26"/>
    </linearGradient>
  </defs>

  <!-- background and hairline frame -->
  <rect x="0" y="0" width="1100" height="220" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1099" height="219" fill="none" stroke="#E5E8EC" stroke-width="1"/>

  <!-- ====================== radar scope, centre (118,110) ====================== -->
  <!-- crosshair -->
  <line x1="32" y1="110" x2="204" y2="110" stroke="#DEE2E7" stroke-width="1"/>
  <line x1="118" y1="24" x2="118" y2="196" stroke="#DEE2E7" stroke-width="1"/>

  <!-- range rings -->
  <circle cx="118" cy="110" r="24" fill="none" stroke="#CBD1D8" stroke-width="1"/>
  <circle cx="118" cy="110" r="45" fill="none" stroke="#CBD1D8" stroke-width="1"/>
  <circle cx="118" cy="110" r="66" fill="none" stroke="#CBD1D8" stroke-width="1"/>
  <circle cx="118" cy="110" r="86" fill="none" stroke="#AAB2BC" stroke-width="1.25"/>

  <!-- range ticks: major every 90 degrees, minor every 15 -->
  <g stroke="#8C95A1" stroke-width="1.25">
    <line x1="118" y1="24" x2="118" y2="34"/>
    <line x1="118" y1="24" x2="118" y2="34" transform="rotate(90 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="34" transform="rotate(180 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="34" transform="rotate(270 118 110)"/>
  </g>
  <g stroke="#B7BFC9" stroke-width="1">
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(15 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(30 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(45 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(60 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(75 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(105 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(120 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(135 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(150 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(165 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(195 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(210 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(225 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(240 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(255 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(285 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(300 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(315 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(330 118 110)"/>
    <line x1="118" y1="24" x2="118" y2="31" transform="rotate(345 118 110)"/>
  </g>

  <!-- sweep wedge, 70 degrees, fading behind the leading edge -->
  <path d="M 118 110 L 68.67 39.55 A 86 86 0 0 1 167.33 39.55 Z" fill="url(#sweep)"/>
  <line x1="118" y1="110" x2="167.33" y2="39.55" stroke="#1E7C5C" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- blips: seven contacts, one per new round this week -->
  <g fill="#1E7C5C">
    <circle cx="146" cy="62" r="4"/>
    <circle cx="146" cy="62" r="8.5" fill="none" stroke="#1E7C5C" stroke-width="1.25" stroke-opacity="0.45"/>
    <circle cx="104" cy="50" r="3.5" fill-opacity="0.95"/>
    <circle cx="76" cy="78" r="3" fill-opacity="0.6"/>
    <circle cx="170" cy="118" r="3" fill-opacity="0.55"/>
    <circle cx="146" cy="142" r="3" fill-opacity="0.5"/>
    <circle cx="88" cy="132" r="3" fill-opacity="0.5"/>
    <circle cx="118" cy="160" r="3" fill-opacity="0.45"/>
  </g>
  <circle cx="118" cy="110" r="2.5" fill="#3A434D"/>

  <!-- ====================== type block ====================== -->
  <!-- stage readout, top right -->
  <text x="1058" y="50" text-anchor="end" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2.5" fill="#8C95A1">PRE-SEED &#183; SEED &#183; SERIES A</text>

  <!-- wordmark -->
  <text x="238" y="116" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="6.5" fill="#14181D">LONDON SEED <tspan fill="#1E7C5C">RADAR</tspan></text>

  <!-- divider rule with scale ticks -->
  <line x1="238" y1="136" x2="1058" y2="136" stroke="#D5DAE0" stroke-width="1"/>
  <g stroke="#C5CBD3" stroke-width="1">
    <line x1="238" y1="136" x2="238" y2="141"/>
    <line x1="320" y1="136" x2="320" y2="141"/>
    <line x1="402" y1="136" x2="402" y2="141"/>
    <line x1="484" y1="136" x2="484" y2="141"/>
    <line x1="566" y1="136" x2="566" y2="141"/>
    <line x1="648" y1="136" x2="648" y2="141"/>
    <line x1="730" y1="136" x2="730" y2="141"/>
    <line x1="812" y1="136" x2="812" y2="141"/>
    <line x1="894" y1="136" x2="894" y2="141"/>
    <line x1="976" y1="136" x2="976" y2="141"/>
    <line x1="1058" y1="136" x2="1058" y2="141"/>
  </g>

  <!-- issue line: swap the text content below for each issue -->
  <circle cx="244" cy="161" r="3.5" fill="#1E7C5C"/>
  <text x="257" y="167" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" letter-spacing="0.5" fill="#4A545F">7 new rounds &#183; week of 10 June 2026</text>
</svg>
