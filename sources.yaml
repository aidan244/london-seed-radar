# London Seed Radar source configuration.
# Edit freely; the pipeline reads this at the start of every run.

# Funding events must fall inside this window to pass the recency gate.
# Steady state is 14 (= issue_cadence_days: one window per fortnight, no
# gaps or overlap). The launch issue (2026-06-29) used a 21-day window to
# draw from the accumulated verified pool; reverted to 14 once it shipped.
lookback_days: 14

# Days between issues. The briefing is biweekly (fortnightly), so the
# dashboard steps the next-issue countdown by this from first_issue_date,
# and the steady-state lookback window matches it.
issue_cadence_days: 14

# Number of companies to feature in each issue. If fewer qualify in a
# fortnight, the issue features all of them and says so; it is never
# padded with unverified companies. Set to 5 on 2026-06-28 alongside the
# move to a biweekly cadence.
companies_per_issue: 5

# Target date for the first biweekly issue (Mondays are publication day).
# The dashboard counts down to this, then steps forward by
# issue_cadence_days. Set to 2026-06-29 on 2026-06-28: the verified pool
# reached five companies and the earlier launch dates had passed.
first_issue_date: 2026-06-29

# Funding press feeds. Public RSS only; never scrape walled sites.
# Audited live 2026-06-21 by per-feed funding-item yield and UK density,
# measured through the sieve's own triage. Dropped TechCrunch, EU-Startups,
# Finextra, and City AM: high entry volume but ~zero UK early-stage raises,
# and City AM/Finextra also false-trigger the funding regex on markets and
# banking headlines. RSS is corroboration, not the main funnel; Companies
# House SH01 filings and the cloud scout do the primary discovery.
rss_feeds:
  # UK-native core.
  - name: UKTN
    url: https://www.uktech.news/feed
  - name: UKTN Funding
    url: https://www.uktech.news/funding/feed
  - name: BusinessCloud
    url: https://businesscloud.co.uk/feed/
  - name: TechRound
    url: https://techround.co.uk/feed/
  - name: Maddyness UK
    url: https://www.maddyness.com/uk/feed/
  - name: Startups.co.uk
    url: https://startups.co.uk/feed/
  # Pan-European, retained because they catch London deep-tech raises the
  # UK-native feeds miss; the geography gate drops their non-UK items.
  - name: Sifted
    url: https://sifted.eu/feed
  - name: Tech.eu
    url: https://tech.eu/feed/
  # Added 2026-06-21 after live vetting (200; each surfaced a real UK raise,
  # a Cambridge seed and a UK Series A respectively):
  - name: Tech Funding News
    url: https://techfundingnews.com/feed/
  - name: Startups Magazine
    url: https://startupsmagazine.co.uk/rss

# Cloud-scout feed proxy. The scheduled cloud routines run from an IP the
# feed providers block: every feed returns HTTP 403 from the sandbox and
# from the WebFetch tool alike (confirmed 2026-06-12 and 2026-06-13). The
# routine fetches each feed through this public re-server, which requests
# from a non-blocked IP and returns the raw feed body; {url} is filled
# with the percent-encoded feed URL. Best-effort triage only: the local
# pipeline fetches feeds directly (200) and stays authoritative, and the
# cloud routine always also runs a WebSearch pass, so a dead proxy never
# means an empty report. Swap the template or blank it to disable.
feed_proxy:
  template: https://api.allorigins.win/raw?url={url}

# Geography is UK-wide, London first: a candidate passes the geography
# gate on a London marker or any other UK marker, and issues lead with
# the London raises. Both lists below merge with the built-in markers in
# radar/geo.py and match on word boundaries only; "uk" never matches
# Ukraine, and UK cities that collide with US cities (Cambridge, MA and
# the like) are masked out.
extra_london_markers: []
# Extra non-London UK markers (towns, regions) to also accept.
extra_uk_markers: []
# Phrases masked out of the text before any marker matching, the
# subtractive twin of the two lists above: if a marker you add collides
# with a foreign place name ("richmond" vs "Richmond, Virginia"), mask
# the foreign phrase here instead of editing radar/geo.py.
extra_exclusion_phrases: []

# Companies House numbers to always check during live ingest,
# for companies you already know about that press has not covered.
watchlist_company_numbers: []

